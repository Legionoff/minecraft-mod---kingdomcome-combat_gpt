name: Minecraft 26.3 port

on:
  workflow_dispatch:
  push:
    paths:
      - 'versions/26.3/**'
      - 'versions/migration/**'
      - 'scripts/port-26.3.sh'
      - '.github/workflows/build-26.3.yml'
      - 'src/**'

permissions:
  contents: read

jobs:
  build-26-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify Java
        run: java -version
      - name: Migrate Yarn sources and Mixin targets to Mojang mappings, then build
        run: bash scripts/port-26.3.sh
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-come-combat-minecraft-26.3
          path: versions/26.3/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
