plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "kingdom_come_combat-${project.minecraft_version}"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://cursemaven.com" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "kingdom_come_combat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java.srcDir rootProject.file("../../build/26.3-remapped/main")
        java.srcDir "src/main/java"
        resources.setSrcDirs([])
    }
    client {
        java.srcDir rootProject.file("../../build/26.3-remapped/client")
        resources.srcDir rootProject.file("../../src/client/resources")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "curse.maven:player-animation-library-1283899:${project.player_animation_library_file}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation "org.javassist:javassist:3.30.2-GA"
}

processResources {
    from(rootProject.file("../../src/main/resources")) {
        exclude "fabric.mod.json"
    }
    from("src/main/resources")
    from(rootProject.file("../../build/26.3-generated-resources"))
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

["processResources", "processClientResources"].each { taskName ->
    tasks.named(taskName) {
        filesMatching("*.mixins.json") {
            filter { String line -> line.replace('"JAVA_21"', '"JAVA_25"') }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
    withSourcesJar()
}

jar {
    from("../../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
