plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "kingdom_come_combat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
    modImplementation files("../../libs/PlayerAnimationLibFabric-1.1.7+mc.1.21.11.jar")
    modCompileOnly files("../../libs/geckolib-fabric-1.21.11-5.4.5.jar")
}

sourceSets {
    main.java.srcDir rootProject.file("../../src/main/java")
    client.java.srcDir rootProject.file("../../src/client/java")
}
